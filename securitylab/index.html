function initDemo(){demo.sources=[['Identity Gateway','IAM'],['Application Gateway','WEB'],['Endpoint Lab','EDR'],['Network Lab','NET'],['Backup Service','SYS']].map(([name,kind],i)=>({id:i+1,name,kind,active:true,last_seen:null}));demo.rules=[{id:1,name:'Серия неудачных входов',kind:'auth_failed',threshold:5,window_minutes:10,severity:'high',enabled:true},{id:2,name:'Изменение привилегий',kind:'privilege_change',threshold:1,window_minutes:5,severity:'high',enabled:true},{id:3,name:'Сигнал EDR',kind:'malware_alert',threshold:1,window_minutes:5,severity:'critical',enabled:true}];for(let i=0;i<30;i++)emitDemo(i%3===0?'backup_ok':'network_alert',ago(220-i*6));for(let i=0;i<5;i++)emitDemo('auth_failed',ago(12-i));emitDemo('privilege_change',ago(6));emitDemo('malware_alert',ago(3));log('seed','Синтетический стартовый набор','system');S.user={name:'admin',role:'admin'};}
async function api(path,method='GET',body){return path.startsWith('/v3/')?advancedDemo(path,method,body):demoApi(path,method,body)}
function demoApi(path,method,b){if(path==='/snapshot')return structuredClone({...demo,audit_check:null});if(path==='/me')return S.user;if(path==='/lab/generate'){if(!canWrite())throw Error('Недостаточно прав');for(let i=0;i<b.count;i++)emitDemo(b.kind);log('lab_generate',`${b.kind} × ${b.count}`);return {ok:true}}let m=path.match(/^\/incidents\/(\d+)(\/comments)?$/);if(m){const i=demo.incidents.find(x=>x.id===+m[1]);if(!i)throw Error('Инцидент не найден');if(method==='GET')return structuredClone({...i,events:demo.events.filter(x=>x.incident_id===i.id),comments:demo.comments[i.id]||[]});if(!canWrite())throw Error('Недостаточно прав');if(m[2]){if(!b.text.trim())throw Error('Пустой комментарий');(demo.comments[i.id]??=[]).push({author:S.user.name,ts:now(),text:b.text.trim()});log('incident_comment',id('INC',i.id))}else{if(b.status==='closed'&&(!b.resolution.trim()||!b.assignee))throw Error('Укажите ответственного и результат расследования');if(i.status==='closed'&&b.status!=='closed'&&!admin())throw Error('Повторное открытие — только администратор');Object.assign(i,b,{updated:now(),resolved:b.status==='closed'?(i.resolved||now()):null});log('incident_update',id('INC',i.id)+': '+b.status)}return {ok:true}}m=path.match(/^\/events\/(\d+)$/);if(m)return demo.events.find(x=>x.id===+m[1]);if(!admin())throw Error('Недостаточно прав');m=path.match(/^\/(sources|rules)\/(\d+)$/);if(m){Object.assign(demo[m[1]].find(x=>x.id===+m[2]),b);log(m[1]+'_update',m[2]);return {ok:true}}if(path==='/users'&&method==='POST'){if(demo.users.some(x=>x.name===b.name))throw Error('Пользователь существует');demo.users.push({name:b.name,role:b.role,active:true});log('user_create',b.name);return {ok:true}}m=path.match(/^\/users\/(.+)$/);if(m){if(m[1]===S.user.name)throw Error('Нельзя изменить собственную роль');Object.assign(demo.users.find(x=>x.name===m[1]),b);log('user_update',m[1]);return {ok:true}}if(path==='/settings'){Object.assign(demo.settings,b);log('settings_update','session_minutes');return {ok:true}}throw Error('Недоступно в демоверсии')}
async function refresh(renderPage=true){S.data=await api('/snapshot');S.advanced=await api('/v3/summary');if(renderPage)render()}
function allPeriod(a,field='ts'){return a.filter(x=>new Date(x[field]).getTime()>=Date.now()-S.period*3600000)}

const metric=(label,value,note,ic,cl='')=>`<div class="metric"><div class="label">${label}<span class="mi ${cl}">${icon(ic)}</span></div><div class="value ${cl}">${value}</div><small>${note}</small></div>`;
function chart(es){const unit=S.period===24?3600000:86400000,N=S.period===24?24:S.period/24,end=Math.floor(Date.now()/unit)*unit,counts=Array(N).fill(0);es.forEach(e=>{const i=N-1-Math.round((end-Math.floor(new Date(e.ts)/unit)*unit)/unit);if(i>=0&&i<N)counts[i]++});let max=Math.max(4,...counts),pts=counts.map((v,i)=>[35+i*535/Math.max(1,N-1),175-v*145/max]),line=pts.map(p=>p.join(',')).join(' ');return `<div class="chart"><svg viewBox="0 0 600 213" role="img" aria-label="График событий за период">${[0,1,2,3,4].map(i=>`<line class="gridline" x1="35" y1="${175-i*36.25}" x2="570" y2="${175-i*36.25}"/><text x="26" text-anchor="end" y="${179-i*36.25}">${Math.round(max*i/4)}</text>`).join('')}<polygon class="area" points="35,175 ${line} 570,175"/><polyline class="line" points="${line}"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3"><title>${counts[i]} событий</title></circle>`).join('')}${[0,1,2,3,4].map(i=>{let j=Math.round(i*(N-1)/4),d=new Date(end-(N-1-j)*unit);return `<text x="${35+j*535/Math.max(1,N-1)}" y="198" text-anchor="middle">${S.period===24?d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})}</text>`}).join('')}</svg></div>`}

function overviewView(){const es=allPeriod(S.data.events),is=allPeriod(S.data.incidents,'created'),open=S.data.incidents.filter(i=>i.status!=='closed'),priority=[...open].sort((a,b)=>Object.keys(sevs).indexOf(b.severity)-Object.keys(sevs).indexOf(a.severity)||b.id-a.id).slice(0,5),active=S.data.sources.filter(x=>x.active).length;return `<div class="grid4">${metric('События за период',fmt(es.length),'В пределах доступной выборки','events','accent')}${metric('Открытые инциденты',fmt(open.length),'Вся доступная очередь','incidents','warn')}${metric('Критические',fmt(open.filter(i=>i.severity==='critical').length),'Требуют внимания','shield','danger')}${metric('Источники включены',`${active}/${S.data.sources.length}`,'Синтетический контур','sources','purple')}</div><div class="grid2"><section class="panel"><div class="panelhead"><div><h2>Динамика событий</h2><p>Распределение по ${S.period===24?'часам':'дням'}</p></div><span class="muted tiny">${S.period===24?'24 ч':S.period/24+' дн.'}</span></div>${chart(es)}</section><section class="panel"><div class="panelhead"><div><h2>Критичность событий</h2><p>Количество по уровням</p></div></div>${breakdown(es)}<div class="kv"><div><span>Всего в выборке</span><b>${es.length}</b></div></div></section></div><section class="panel flush"><div class="panelhead"><div><h2>Приоритетные инциденты</h2><p>Открытые расследования, от критических к низким</p></div><button class="small" data-nav="incidents">Все инциденты ${icon('right')}</button></div>${table(['ID','Инцидент','Приоритет','Статус','Ответственный',''],incidentRows(priority),'Открытых инцидентов нет')}</section><div class="gridEqual"><section class="panel"><div class="panelhead"><h2>Источники телеметрии</h2><button class="small" data-nav="sources">Реестр</button></div><div class="kv">${S.data.sources.map(x=>`<div><span>${esc(x.name)}</span>${badge(x.active?'active':'disabled',{active:'Включён',disabled:'Отключён'})}</div>`).join('')}</div></section><section class="panel"><div class const options=(map,val)=>Object.entries(map).map(([k,v])=>`<option value="${esc(k)}" ${k===String(val)?'selected':''}>${esc(v)}</option>`).join('');const filterSelect=(name,map,value)=>`<select id="${name}">${options(map,value)}</select>`;
function filters(inc=false){return `<div class="panel no-print"><div class="filters"><label>Поиск<input id="q" placeholder="${inc?'Название, ID, ответственный':'ID, тип, источник, пользователь…'}" value="${esc(S.q)}"></label><label>Критичность${filterSelect('severity',{all:'Все уровни',...sevs},S.severity)}</label>${inc?`<label>Статус${filterSelect('status',{all:'Все статусы',...statuses},S.status)}</label>`:`<label>Источник${filterSelect('source',{all:'Все источники',...Object.fromEntries(S.data.sources.map(x=>[x.id,x.name]))},S.source)}</label>`}<label>Сортировка${filterSelect('sort',{newest:'Сначала новые',oldest:'Сначала старые',severity:'По критичности'},S.sort)}</label><button data-action="clear-filters">Сбросить</button></div></div>`}

function rulesView(){return `<section class="panel flush"><div class="panelhead"><div><h2>Правила корреляции</h2><p>События одного типа, источника и субъекта в заданном окне</p></div></div>${table(['Название','Тип события','Порог','Окно','Приоритет','Состояние',''],S.data.rules.map(r=>[esc(r.name),esc(kinds[r.kind]),`${r.threshold} соб.`,`${r.window_minutes} мин.`,badge(r.severity,sevs),badge(r.enabled?'active':'disabled',{active:'Активно',disabled:'Отключено'}),admin()?`<button class="small" data-rule="${r.id}">Настроить</button>`:'—']))}</section><section class="panel"><h2>Как работает корреляция</h2><div class="guide"><div><strong>Поступление → нормализация</strong><span class="muted">Событие записывается с типом, временем, источником и субъектом.</span></div><div><strong>Правило → связанный инцидент</strong><span class="muted">Достижение порога формирует расследование. Последующие совпадающие события связываются с незакрытым инцидентом.</span></div><div><strong>Приоритет правил</strong><span class="muted">Одно событие связывается не более чем с одним инцидентом; первое подходящее правило имеет приоритет.</span></div></div></section>`}
function reportsView(){let es=allPeriod(S.data.events),incs=allPeriod(S.data.incidents,'created'),closed=incs.filter(i=>i.resolved),dur=closed.length?Math.round(closed.reduce((sum,i)=>sum+Math.max(0,new Date(i.resolved)-new Date(i.created))/60000,0)/closed.length):null;return `<div class="grid4">${metric('События',es.length,'За выбранный период','events','accent')}${metric('Инциденты',incs.length,'Созданы за период','incidents','warn')}${metric('Закрыто',closed.length,'Из созданных за период','shield','teal')}${metric('Среднее время закрытия',dur===null?'—':dur+' м','Только закрытые в выборке','clock','purple')}</div><div class="grid2"><section class="panel"><h2>Динамика событий</h2>${chart(es)}</section><section class="panel"><h2>Распределение критичности</h2>${breakdown(es)}</section></div><section class="panel flush"><div class="panelhead"><div><h2>Сводка по источникам</h2><p>За выбранный период</p></div></div>${table(['Источник','Тип','События','Высокий / критический'],S.data.sources.map(s=>[esc(s.name),esc(s.kind),es.filter(e=>e.source_id===s.id).length,es.filter(e=>e.source_id===s.id&&['high','critical'].includes(e.severity)).length]))}</section><section class="panel no-print"><div class="panelhead"><div><h2>Экспорт</h2><p>CSV — доступная полная выборка (не фильтр периода); PDF — печать текущего отчёта.</p></div></div><div class="row"><button data-export="events">${icon('download')} События CSV</button><button data-export="incidents">${icon('download')} Инциденты CSV</button>${DEMO?'':`<button data-xlsx="events">${icon('download')} События XLSX</button><button data-xlsx="incidents">${icon('download')} Инциденты XLSX</button>`}<button data-action="print">Печать / PDF</button></div></section>`}
function usersView(){return `<section class="panel flush"><div class="panelhead"><div><h2>Учётные записи</h2><p>${DEMO?'Имитация полномочий, без настоящих паролей':'Управление ролями и отзывом сессий'}</p></div><button class="primary" data-action="new-user">${icon('plus')} Пользователь</button></div>${table(['Пользователь','Роль','Состояние','MFA',''],S.data.users.map(u=>[esc(u.name)+(u.name===S.user.name?' <span class="muted">(вы)</span>':''),esc(roles[u.role]),badge(u.active?'active':'disabled',{active:'Активен',disabled:'Заблокирован'}),DEMO?'Симуляция':u.mfa?'TOTP':'Не включена',u.name===S.user.name?'—':`<button class="small" data-user="${esc(u.name)}">Изменить</button>`]))}</section><section class="panel"><h2>Матрица доступа</h2>${table(['Операция','Наблюдатель','Аналитик','Администратор'],[['Просмотр / экспорт','Да','Да','Да'],['Расследования / лаборатория','Нет','Да','Да'],['Настройка правил / источников','Нет','Нет','Да'],['Пользователи / аудит / настройки','Нет','Нет','Да'],['Повторное открытие инцидента','Нет','Нет','Да']])}</section>`}
function auditView(){let c=S.data.audit_check;return `<section class="panel"><div class="row between"><div><h2>${DEMO?'Имитация журнала действий':c?.valid?'Цепочка аудита согласована':'Нарушение цепочки аудита'}</h2><p class="muted tiny">${DEMO?'Контроль целостности выполняется только серверной версией.':`Проверено записей: ${c?.count??0}. Хеш-цепочка не защищает от администратора БД, способного переписать всю цепь.`}</p></div>${badge(DEMO?'medium':c?.valid?'active':'critical',{medium:'Демо',active:'Проверено',critical:'Ошибка'})}</div></section><section class="panel flush"><div class="panelhead"><h2>Последние действия</h2><span class="muted tiny">До 300 записей</span></div>${table(['Время','Субъект','Действие','Детали','Хеш'],S.data.audit.map(x=>[dt(x.ts),esc(x.actor),`<span class="mono">${esc(x.action)}</span>`,esc(x.detail),`<span class="mono" title="${esc(x.digest)}">${esc(x.digest.slice(0,10))}</span>`]))}</section>`}
function settingsView(){return `<div class="gridEqual"><section class="panel"><div class="panelhead"><h2>Безопасность сессии</h2>${icon('shield')}</div><form data-form="settings" class="formgrid"><label class="full">Срок действия новых сессий, минут (10–480)<input name="session_minutes" type="number" min="10" max="480" value="${S.data.settings.session_minutes||60}" required></label><div class="full muted tiny">Не влияет на уже выданные сессии. При смене роли или блокировке сессии пользователя отзываются.</div><div class="full"><button type="submit" class="primary">Сохранить</button></div></form></section><section class="panel"><div class="panelhead"><h2>Информация о системе</h2></div><div class="kv"><div><span>Версия</span><b>3.0</b></div><div><span>Режим</span><b>${DEMO?'Автономное демо':'Серверный'}</b></div><div><span>Данные</span><b>Синтетические</b></div><div><span>Тема интерфейса</span><button class="small" data-action="theme">${S.theme==='dark'?'Светлая':'Тёмная'}</button></div></div></section></div><section class="panel"><h2>Границы применения</h2><p class="muted">Учебный стенд не является промышленной SIEM, не прошёл независимый аудит, не подключён к государственным информационным системам. Для сетевого развёртывания требуются дополнительное укрепление и TLS.</p></section>`}
function labView(){return `<section class="panel"><div class="panelhead"><div><h2>Синтетические сценарии</h2><p>Создание тестовых записей, а не имитация атак на внешние системы.</p></div>${icon('lab')}</div><div class="laboptions">${Object.entries(kinds).map(([k,v])=>`<button class="laboption ${S.labKind===k?'selected':''}" data-kind="${k}">${icon(k==='backup_ok'?'sources':'incidents')}<strong>${v}</strong><small>${samples[k][4]}</small></button>`).join('')}</div><form class="formgrid" data-form="generate"><label>Количество событий (1–20)<input type="number" name="count" min="1" max="20" value="${S.labCount}" required></label><div class="row"><button class="primary" type="submit" ${canWrite()?'':'disabled'}>${icon('plus')} Сгенерировать</button></div></form>${!canWrite()?'<p class="muted tiny">Роль наблюдателя не позволяет создавать события.</p>':''}</section><section class="panel"><h2>Сценарий демонстрации</h2><div class="guide"><div><strong>1. Закройте существующий инцидент входа</strong><span class="muted">Назначьте ответственного и укажите результат расследования.</span></div><div><strong>2. Сгенерируйте пять ошибок входа</strong><span class="muted">При активном правиле с порогом 5 будет создан новый инцидент, если в окне достаточно несвязанных событий.</span></div><div><strong>3. Проверьте расследование и журнал</strong><span class="muted">Откройте новый инцидент, изучите пять связанных записей, проверьте аудит в роли администратора.</span></div></div></section>`}
function view(){return ({overview:overviewView,events:()=>listView(false),incidents:()=>listView(true),sources:sourcesView,rules:rulesView,reports:reportsView,users:usersView,audit:auditView,settings:settingsView,lab:()=>labView()+importView(),assets:assetsView,notifications:notificationsView,assistant:assistantView,tour:tourView})[S.page]()}
function kv(rows){return `<div class="kv">${rows.map(([k,v])=>`<div><span>${k}</span><b class="wraptext">${v}</b></div>`).join('')}</div>`}
function renderDrawer(){const root=$('#drawer-root');if(!root)return;if(!S.drawer){root.innerHTML='';return}const {kind,d}=S.drawer;let title='',desc='',body='';if(kind==='event'){title=id('EVT',d.id);desc=kinds[d.kind];body=`<section class="panel">${kv([['Время',dt(d.ts)],['Источник',esc(sourceName(d.source_id))],['Критичность',badge(d.severity,sevs)],['Субъект',esc(d.actor)],['Узел',esc(d.host)],['Инцидент',d.incident_id?`<button class="linkbtn" data-incident="${d.incident_id}">${id('INC',d.incident_id)}</button>`:'—']])}</section><section class="panel"><h2>Нормализованное сообщение</h2><p class="wraptext">${esc(d.detail)}</p></section>`}if(kind==='incident'){title=id('INC',d.id);desc=d.title;body=`<div class="row">${badge(d.severity,sevs)}${badge(d.status,statuses)}<span class="muted tiny">Создан ${dt(d.created)}</span></div><section class="panel"><h2>Карточка расследования</h2>${kv([['Ответственный',esc(d.assignee||'Не назначен')],['Правило',esc(S.data.rules.find(r=>r.id===d.rule_id)?.name||'—')],['Обновлён',dt(d.updated)],['Закрыт',dt(d.resolved)]])}${canWrite()?`<form data-form="incident" class="formgrid"><label>Статус<select name="status">${options(statuses,d.status)}</select></label><label>Ответственный<select name="assignee">${options({'':'Не назначен',...Object.fromEntries(S.data.users.filter(u=>u.active&&u.role!=='viewer').map(u=>[u.name,u.name]))},d.assignee||'')}</select></label><label class="full">Результат расследования<textarea name="resolution" maxlength="2000" placeholder="Обстоятельства, решение и дальнейшие меры">${esc(d.resolution)}</textarea></label><div class="full"><button class="primary" type="submit">Сохранить изменения</button></div></form>`:`<p>${esc(d.resolution||'Результат не указан')}</p>`}</section><section class="panel flush"><div class="panelhead"><h2>Связанные события (${d.events.length})</h2></div>${table(['ID','Время','Событие'],d.events.map(e=>[`<button class="linkbtn mono" data-event="${e.id}">${id('EVT',e.id)}</button>`,dt(e.ts),esc(kinds[e.kind])]))}</section><section class="panel"><h2>Комментарии расследования</h2><div class="timeline">${d.comments.length?d.comments.map(c=>`<div class="comment"><div class="row between"><b>${esc(c.author)}</b><span class="muted tiny">${dt(c.ts)}</span></div><p>${esc(c.text)}</p></div>`).join(''):'<p class="muted">Комментариев пока нет.</p>'}</div>${canWrite()?`<form data-form="comment"><label>Добавить комментарий<textarea name="text" maxlength="2000" required></textarea></label><button type="submit">Отправить</button></form>`:''}</section>`}if(kind==='rule'){title='Настройка правила';desc=d.name;body=`<section class="panel"><form data-form="rule" class="formgrid"><label class="check full"><input type="checkbox" name="enabled" ${d.enabled?'checked':''}> Правило активно</label><label>Порог событий<input type="number" name="threshold" min="1" max="20" value="${d.threshold}" required></label><label>Окно, минут<input type="number" name="window_minutes" min="1" max="1440" value="${d.window_minutes}" required></label><label class="full">Приоритет<select name="severity">${options(sevs,d.severity)}</select></label><div class="full"><button class="primary" type="submit">Сохранить правило</button></div></form></section>`}if(kind==='user'||kind==='new-user'){title=kind==='new-user'?'Новый пользователь':'Изменить пользователя';desc=DEMO?'Симуляция управления доступом':'Изменение прав отзывает существующие сессии';body=`<section class="panel"><form data-form="${kind}" class="formgrid">${kind==='new-user'?`<label class="full">Логин<input name="name" pattern="[a-zA-Z0-9_.-]{3,64}" required></label>`:`<label class="full">Логин<input value="${esc(d.name)}" disabled></label>`}<label class="full">Роль<select name="role">${options(roles,d?.role||'viewer')}</select></label>${kind==='user'?`<label class="check full"><input type="checkbox" name="active" ${d.active?'checked':''}> Учётная запись активна</label>`:''}<div class="full"><button class="primary" type="submit">Сохранить</button></div></form></section>`}root.innerHTML=`<div class="drawer-shade" data-action="shade"><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="drawerhead"><div><div class="eyebrow">SECURITYLAB / DETAIL</div><h1>${esc(title)}</h1><p class="muted">${esc(desc)}</p></div><button class="small" data-action="close-drawer" aria-label="Закрыть">${icon('close')}</button></div>${body}${kind==='incident'&&d.advanced?investigationView(d.advanced):''}</aside></div>`}
async function openDrawer(k,id){let d;if(k==='event'||k==='incident')d=await api(`/${k==='event'?'events':'incidents'}/${id}`);else if(k==='rule')d=S.data.rules.find(x=>x.id===+id);else if(k==='user')d=S.data.users.find(x=>x.name===id);if(k==='incident')d.advanced=await api('/v3/investigations/'+id);S.drawer={kind:k,d};renderDrawer();$('.drawer [data-action="close-drawer"]')?.focus()}
function renderLogin(){app.textContent='Демонстрационная сессия завершена. Обновите страницу, чтобы начать заново.'}
function csvDownload(kind){let rows=demo[kind],fields=kind==='events'?['id','ts','source_id','kind','severity','actor','host','detail','incident_id']:['id','title','severity','status','assignee','created','updated','resolved','resolution'];const safe=v=>{v=String(v??'');if(/^[\s]*[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replaceAll('"','""')+'"'};const text='\uFEFF'+fields.join(',')+'\n'+rows.map(r=>fields.map(k=>safe(r[k])).join(',')).join('\n');let a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.href=url;a.download=kind+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function go(p){if(!validPage(p))return;S.page=p;S.q='';S.severity=S.source=S.status='all';S.pageNum=1;S.drawer=null;S.mobile=false;render();window.scrollTo(0,0)}

app.addEventListener('click',async ev=>{const b=ev.target.closest('button');try{if(!b){if(ev.target.classList.contains('drawer-shade')){S.drawer=null;renderDrawer()}return}const d=b.dataset;if(d.nav)return go(d.nav);if(d.event)return await openDrawer('event',d.event);if(d.incident)return await openDrawer('incident',d.incident);if(d.rule)return await openDrawer('rule',d.rule);if(d.user)return await openDrawer('user',d.user);if(d.export)return csvDownload(d.export);if(d.kind){S.labKind=d.kind;render();return}if(d.toggleSource){const x=S.data.sources.find(x=>x.id===+d.toggleSource);await mutation('/sources/'+x.id,'PATCH',{active:!x.active});render();return}switch(d.action){case 'menu':S.mobile=!S.mobile;$('.sidebar')?.classList.toggle('open',S.mobile);break;case 'theme':S.theme=S.theme==='dark'?'light':'dark';try{localStorage.setItem('sl-theme',S.theme)}catch{}document.body.classList.toggle('light',S.theme==='light');break;case 'refresh':await refresh();tell('Данные обновлены');break;case 'close-drawer':S.drawer=null;renderDrawer();break;case 'new-user':await openDrawer('new-user');break;case 'clear-filters':S.q='';S.severity=S.source=S.status='all';S.sort='newest';S.pageNum=1;render();break;case 'prev':S.pageNum--;$('#list-body').innerHTML=listBody(S.page==='incidents');break;case 'next':S.pageNum++;$('#list-body').innerHTML=listBody(S.page==='incidents');break;case 'print':window.print();break}}catch(e){tell(e.message,true)}});
app.addEventListener('input',ev=>{if(ev.target.id==='q'){S.q=ev.target.value;S.pageNum=1;$('#list-body').innerHTML=listBody(S.page==='incidents')}if(ev.target.name==='count')S.labCount=+ev.target.value});
app.addEventListener('change',async ev=>{let t=ev.target;if(t.id==='period'){S.period=+t.value;S.pageNum=1;render()}else if(t.id==='demo-role'){let u=demo.users.find(x=>x.role===t.value&&x.active);if(!u){tell('Нет активной учётной записи этой роли',true);t.value=S.user.role;return}S.user={name:u.name,role:u.role};S.drawer=null;S.aiResult=null;log('demo_role',u.role);await refresh();tell('Роль изменена в симуляции')}else if(['severity','source','status','sort'].includes(t.id)){S[t.id]=t.value;S.pageNum=1;$('#list-body').innerHTML=listBody(S.page==='incidents')}});
app.addEventListener('submit',async ev=>{ev.preventDefault();const f=ev.target,b=Object.fromEntries(new FormData(f)),kind=f.dataset.form,button=f.querySelector('button[type=submit]');if(button)button.disabled=true;try{if(kind==='generate'){await mutation('/lab/generate','POST',{kind:S.labKind,count:+b.count});S.labCount=+b.count;render();tell('Синтетические события созданы');return}if(kind==='incident'){let i=S.drawer.d.id;await mutation('/incidents/'+i,'PATCH',{status:b.status,assignee:b.assignee||null,resolution:b.resolution});S.drawer=null;render();await openDrawer('incident',i);return}if(kind==='comment'){let i=S.drawer.d.id;await mutation('/incidents/'+i+'/comments','POST',{text:b.text});S.drawer=null;render();await openDrawer('incident',i);return}if(kind==='rule')await mutation('/rules/'+S.drawer.d.id,'PATCH',{enabled:b.enabled==='on',threshold:+b.threshold,window_minutes:+b.window_minutes,severity:b.severity});if(kind==='user')await mutation('/users/'+encodeURIComponent(S.drawer.d.name),'PATCH',{role:b.role,active:b.active==='on'});if(kind==='new-user')await mutation('/users','POST',b);if(kind==='settings')await mutation('/settings','PATCH',{session_minutes:+b.session_minutes});S.drawer=null;render()}catch(e){tell(e.message,true);if(button)button.disabled=false}});

const demoInvest={};S.aiId=1;S.aiResult=null;S.aiTask='analysis';S.aiMode='rules';
function demoDetail(i){const es=demo.events.filter(e=>e.incident_id===i.id).sort((a,b)=>a.ts.localeCompare(b.ts)),r=demo.rules.find(r=>r.id===i.rule_id),due=new Date(new Date(i.created).getTime()+SLA[i.severity]*60000).toISOString(),row=demoInvest[i.id]||{completed:[],verdict:'pending',evidence:''};return {incident:i,events:es,assets:[...new Set(es.map(e=>e.host))],actors:[...new Set(es.map(e=>e.actor))],sources:[...new Set(es.map(e=>e.source_id))],timeline:[...es.map(e=>({ts:e.ts,text:id('EVT',e.id)+' · '+kinds[e.kind]})),{ts:i.created,text:'Инцидент создан'},...(demo.comments[i.id]||[]).map(c=>({ts:c.ts,text:'Комментарий: '+c.author})),...(row.updated?[{ts:row.updated,text:'Обновлён план расследования'}]:[]),...(i.resolved?[{ts:i.resolved,text:'Инцидент закрыт'}]:[])].sort((a,b)=>a.ts.localeCompare(b.ts)),steps:STEPS,...row,due,overdue:new Date(i.resolved||now())>new Date(due),technique:TECH[r?.kind]||[null,'']}}
function advancedDemo(path,method,b){if(path==='/v3/summary'){const closed=demo.incidents.filter(i=>i.resolved),classified=demo.incidents.filter(i=>demoInvest[i.id]&&demoInvest[i.id].verdict!=='pending');return {assets:[...new Set(demo.events.map(e=>e.host))].sort().map(host=>{let es=demo.events.filter(e=>e.host===host),ids=[...new Set(es.map(e=>e.incident_id).filter(Boolean))],risk=demo.incidents.filter(i=>ids.includes(i.id)&&!i.resolved).sort((a,b)=>Object.keys(sevs).indexOf(b.severity)-Object.keys(sevs).indexOf(a.severity))[0]?.severity||'low';return {host,events:es.length,incidents:ids.length,risk,last_seen:es[0].ts}}),metrics:{closed:closed.length,mttr_minutes:closed.length?Math.round(closed.reduce((n,i)=>n+(new Date(i.resolved)-new Date(i.created))/60000,0)/closed.length*10)/10:null,sla_percent:closed.length?Math.round(100*closed.filter(i=>!demoDetail(i).overdue).length/closed.length*10)/10:null,false_positive_percent:classified.length?Math.round(100*classified.filter(i=>demoInvest[i.id].verdict==='false_positive').length/classified.length*10)/10:null,classified:classified.length},notifications:demo.incidents.filter(i=>!i.resolved&&['critical','high'].includes(i.severity)).map(i=>({id:i.id,title:i.title,severity:i.severity,overdue:demoDetail(i).overdue})),techniques:demo.rules.map(r=>({id:r.id,name:r.name,technique:TECH[r.kind]||[null,''],enabled:r.enabled}))}}if(!canWrite()&&method!=='GET')throw Error('Недостаточно прав');let m=path.match(/^\/v3\/investigations\/(\d+)$/);if(m){let i=demo.incidents.find(i=>i.id===+m[1]);if(!i)throw Error('Инцидент не найден');if(method==='GET')return structuredClone(demoDetail(i));if(i.status==='closed')throw Error('Расследование закрыто');demoInvest[i.id]={...b,updated:now()};log('investigation_update',id('INC',i.id));return {ok:true}}if(path==='/v3/import'){let rows;try{rows=b.format==='json'?JSON.parse(b.content):b.content.trim().split(/\r?\n/).slice(1).map(kind=>({kind:kind.trim()}));if(b.format==='csv'&&b.content.trim().split(/\r?\n/)[0]!=='kind')throw Error();if(!Array.isArray(rows)||rows.length<1||rows.length>100||rows.some(r=>!r||Object.keys(r).length!==1||!Object.hasOwn(kinds,r.kind)))throw Error()}catch{throw Error('Требуется 1–100 синтетических записей с полем kind')}if(rows.some(r=>!demo.sources.find(s=>s.id===samples[r.kind][0])?.active))throw Error('Один из источников отключён');rows.forEach(r=>emitDemo(r.kind));log('synthetic_import',rows.length);return{count:rows.length}}if(path==='/v3/assistant'){let i=demo.incidents.find(i=>i.id===+b.incident_id);if(!i)throw Error('Инцидент не найден');if(b.mode!=='rules')throw Error('Доступен только режим правил');let es=demoDetail(i).events.slice(-50),counts={};es.forEach(e=>counts[e.kind]=(counts[e.kind]||0)+1);const purpose={analysis:'Сопоставьте повторы и контекст субъекта.',risk:'Приоритет правила: '+sevs[i.severity]+'. Это не подтверждение компрометации.',response:'Следуйте регламенту с ручным согласованием мер.',report:'Проект заключения: гипотеза требует подтверждения.'};log('assistant',id('INC',i.id)+' '+b.task);return {mode:'rules',context_count:es.length,result:{summary:Object.entries(counts).map(([k,n])=>kinds[k]+': '+n).join(', ')+'. '+purpose[b.task],hypothesis:'Срабатывание правила требует проверки; факт компрометации не установлен.',actions:STEPS,event_ids:es.map(e=>e.id)},warning:'Рекомендации требуют проверки человеком.'}}throw Error('Неизвестный запрос')}
function assetsView(){let a=S.advanced.assets;return `<section class="panel flush"><div class="panelhead"><div><h2>Наблюдаемые активы</h2><p>Выявлены по host в синтетических событиях. Риск — максимальная критичность открытого инцидента, не полноценная оценка риска.</p></div></div>${table(['Актив','События','Инциденты','Приоритет','Последняя активность',''],a.map(x=>[esc(x.host),x.events,x.incidents,badge(x.risk,sevs),dt(x.last_seen),`<button data-v3="asset" data-host="${esc(x.host)}">События</button>`]))}</section>`}
function notificationsView(){return `<section class="panel flush"><div class="panelhead"><h2>Требуют внимания</h2><p>Критические и высокие незакрытые инциденты. SLA: учебный срок до закрытия.</p></div>${table(['Инцидент','Приоритет','SLA',''],S.advanced.notifications.map(n=>[esc(n.title),badge(n.severity,sevs),n.overdue?'Просрочен':'В пределах срока',`<button data-incident="${n.id}">Открыть</button>`]))}</section>`}
function advancedReports(){let m=S.advanced.metrics;return `<section class="panel"><h2>Показатели расследований</h2><p class="muted">Последние до 500 инцидентов, независимо от фильтра периода. SLA — доля закрытых в пределах учебного срока. Ложные срабатывания — только классифицированные.</p><div class="grid4">${metric('Среднее до закрытия',m.mttr_minutes===null?'—':m.mttr_minutes+' м','От создания до закрытия','clock')}${metric('SLA',m.sla_percent===null?'—':m.sla_percent+'%','Закрытые инциденты','shield')}${metric('Ложные срабатывания',m.false_positive_percent===null?'—':m.false_positive_percent+'%','Из классифицированных','incidents')}${metric('Классифицировано',m.classified,'Явное решение аналитика','reports')}</div></section>`}
function techniquesView(){return `<section class="panel flush"><div class="panelhead"><h2>Связь правил с MITRE ATT&CK</h2><p>Учебное сопоставление, не измерение покрытия и не доказательство атаки.</p></div>${table(['Правило','Техника','Сопоставление'],S.advanced.techniques.map(r=>[esc(r.name),r.technique[0]?`<a href="https://attack.mitre.org/techniques/${esc(r.technique[0])}/" target="_blank" rel="noopener noreferrer">${esc(r.technique[0])}</a>`:'—',esc(r.technique[1]||'Не классифицировано')]))}</section>`}
function assistantView(){let r=S.aiResult;return `<section class="panel"><div class="panelhead"><div><h2>Контекстный анализ</h2><p>Детерминированный анализ по правилам — не нейросеть.</p></div>${icon('assistant')}</div><form data-v3-form="assistant" class="formgrid"><label>Инцидент<select name="incident_id">${options(Object.fromEntries(S.data.incidents.map(i=>[i.id,id('INC',i.id)+' · '+i.title])),S.aiId)}</select></label><label>Задача<select name="task">${options({analysis:'Анализ',risk:'Оценка риска',response:'План реагирования',report:'Проект заключения'},S.aiTask)}</select></label><label>Режим<select name="mode">${options({rules:'По правилам (не ИИ)'},S.aiMode)}</select></label><div class="row"><button type="submit" class="primary" ${canWrite()?'':'disabled'}>Подготовить анализ</button></div></form></section>${r?`<section class="panel"><div class="panelhead"><h2>Результат · ${id('INC',r.incident_id)}</h2><span class="muted">Детерминированный режим · ${r.context_count} событий</span></div><p>${esc(r.result.summary)}</p><h3>Гипотеза</h3><p>${esc(r.result.hypothesis)}</p><h3>Рекомендации</h3><ol>${r.result.actions.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><div class="row">${r.result.event_ids.map(n=>`<button data-event="${n}" class="small">${id('EVT',n)}</button>`).join('')}</div><p class="muted">${esc(r.warning)}</p><button data-v3="copy-ai">Копировать заключение</button></section>`:''}`}
function importView(){return `<section class="panel"><h2>Импорт синтетических сценариев</h2><p class="muted">JSON/CSV, 1–100 строк. Только поле kind; остальные атрибуты генерирует стенд. Сырые журналы и реальные данные не загружать.</p><form data-v3-form="import"><label>Формат<select name="format"><option value="json">JSON</option><option value="csv">CSV</option></select></label><label>Содержимое<textarea name="content" maxlength="20000" required>[{"kind":"auth_failed"},{"kind":"backup_ok"}]</textarea></label><button type="submit" ${canWrite()?'':'disabled'}>Импортировать</button></form></section>`}
function tourView(){return `<section class="panel"><h2>Демонстрационный маршрут</h2><p>Все операции выполняются в учебном контуре. Начните с мониторинга и завершите отчётом.</p><div class="guide">${[['overview','1. Центр мониторинга','Изучите очередь приоритетных инцидентов.'],['incidents','2. Расследование','Откройте карточку, заполните регламент и заключение.'],['assets','3. Активы','Проверьте затронутые узлы.'],['assistant','4. Контекстный помощник','Получите рекомендации со ссылками на события.'],['lab','5. Лаборатория','Создайте пять учебных ошибок входа после закрытия старого расследования.'],['reports','6. Отчётность','Проверьте KPI и экспортируйте данные.']].map(([p,t,d])=>`<div><strong>${t}</strong><span>${d}</span><button data-nav="${p}">Перейти</button></div>`).join('')}</div></section>`}
function investigationView(d){let w=canWrite()&&d.incident.status!=='closed';return `<section class="panel"><div class="panelhead"><h2>Расследование · SLA</h2><span class="${d.overdue?'warn':'muted'}">${d.overdue?'Срок превышен':'В пределах срока'} · ${dt(d.due)}</span></div><p>Техника: ${esc(d.technique[0]||'Не классифицировано')} ${esc(d.technique[1]||'')}</p><div class="linkmap"><div class="node root">${id('INC',d.incident.id)}</div><div class="node-row">${d.assets.map(h=>`<button class="node" data-v3="asset" data-host="${esc(h)}">Актив · ${esc(h)}</button>`).join('')}${d.sources.map(n=>`<button class="node" data-v3="source" data-source="${n}">Источник · ${n}</button>`).join('')}${d.actors.map(a=>`<div class="node">Субъект · ${esc(a)}</div>`).join('')}</div></div><h3>Хронология</h3><div class="timeline">${d.timeline.slice(-100).map(x=>`<div class="comment"><span class="muted tiny">${dt(x.ts)}</span> · ${esc(x.text)}</div>`).join('')}</div><h3>Регламент реагирования</h3><form data-v3-form="investigation" data-id="${d.incident.id}">${d.steps.map((x,n)=>`<label class="check"><input type="checkbox" name="step" value="${n}" ${d.completed.includes(n)?'checked':''} ${w?'':'disabled'}>${esc(x)}</label>`).join('')}<label>Классификация<select name="verdict" ${w?'':'disabled'}>${options(VERDICTS,d.verdict)}</select></label><label>Доказательства / наблюдения<textarea name="evidence" maxlength="4000" ${w?'':'disabled'}>${esc(d.evidence)}</textarea></label>${w?'<button type="submit" class="primary">Сохранить расследование</button>':''}</form><button data-v3="ask" data-id="${d.incident.id}">Открыть помощник</button></section>`}
function globalSearch(){const q=prompt('Поиск по ID, названию, активу или событию');if(q===null)return;go(/^INC-/i.test(q)||S.data.incidents.some(i=>i.title.toLowerCase().includes(q.toLowerCase()))?'incidents':'events');S.q=q;S.pageNum=1;render()}
app.addEventListener('click',async ev=>{const b=ev.target.closest('button');if(!b)return;let a=b.dataset.v3;if(!a&&b.dataset.action!=='global-search')return;ev.stopImmediatePropagation();try{if(b.dataset.action==='global-search')globalSearch();if(a==='asset'){go('events');S.q=b.dataset.host;render()}if(a==='source'){go('events');S.source=b.dataset.source;render()}if(a==='ask'){S.aiId=+b.dataset.id;S.aiResult=null;go('assistant')}if(a==='copy-ai'){await navigator.clipboard.writeText(JSON.stringify(S.aiResult.result,null,2));tell('Заключение скопировано')}}catch(e){tell(e.message,true)}},true);
app.addEventListener('submit',async ev=>{let f=ev.target,k=f.dataset.v3Form;if(!k)return;ev.preventDefault();ev.stopImmediatePropagation();let fd=new FormData(f),b=Object.fromEntries(fd),btn=f.querySelector('button[type=submit]');btn.disabled=true;try{if(k==='assistant'){S.aiId=+b.incident_id;S.aiTask=b.task;S.aiMode=b.mode;S.aiResult=null;let owner=S.user;let result=await api('/v3/assistant','POST',{...b,incident_id:S.aiId});if(S.user!==owner)return;S.aiResult={...result,incident_id:S.aiId};render()}if(k==='import'){let r=await api('/v3/import','POST',b);await refresh();tell('Импортировано: '+r.count)}if(k==='investigation'){let n=+f.dataset.id;await api('/v3/investigations/'+n,'PUT',{completed:fd.getAll('step').map(Number),verdict:b.verdict,evidence:b.evidence});await refresh(false);await openDrawer('incident',n);tell('Регламент сохранён')}}catch(e){tell(e.message,true);btn.disabled=false}},true);
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'&&S.user){e.preventDefault();globalSearch()}});

(async()=>{try{initDemo();await refresh()}catch(e){app.textContent='Не удалось загрузить SecurityLab: '+e.message}})();

</script></body></html>
